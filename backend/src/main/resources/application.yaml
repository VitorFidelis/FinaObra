server:
  port: 8080

spring:
  application:
    name: FinaObra
  web:
    error:
      include-stacktrace: never
  datasource:
    username: ${USER_DB} 
    password: ${PASSWORD_DB}
    url: ${URL_DB}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    user: ${USER_DB}
    password: ${PASSWORD_DB}
    url: ${URL_DB}
  jpa:
    hibernate:
      ddl-auto: none

springdoc:
  api-docs:
    enabled: true
    path: api-docs
  swagger-ui:
    operationsSorter: method 
    enabled: true
    path: /swagger-ui.html

api:
  security:
    token: 
      secret: ${SECURITY_SECRET_TOKEN}
      expiry-hours: ${JWT_EXPIRY_HOURS:2}

cors:
  # Origens permitidas separadas por vírgula. Padrão: apenas localhost:8080.
  # Exemplo: http://meuapp.com,https://meuapp.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
